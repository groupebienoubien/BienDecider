name: Delegation risk progress

on:
  push:
    branches: [main]
    paths:
      - src/lib/delegation-risk.ts
      - src/lib/site/publish.ts
      - src/app/api/gmail/send/route.ts
      - src/app/api/proposals/**/execute/route.ts
      - src/components/proposal-card.tsx
      - tests/delegation.spec.ts
      - tests/user-journey.spec.ts
      - .github/workflows/delegation-risk-progress.yml
      - src/lib/delegation-policy.ts
      - src/app/admin/risques/**
      - src/app/admin/delegation-risk-settings.tsx
      - src/app/api/admin/delegation-risk/route.ts
      - prisma/schema.prisma
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delegation-risk-progress
  cancel-in-progress: false

jobs:
  update-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Mark del-5 in progress and record delivered scope
        uses: actions/github-script@v9
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
            const issue = issues.find(item => !item.pull_request && item.body?.includes('<!-- biendecider-us:del-5 -->'));
            if (!issue) throw new Error('Delegation risk US del-5 was not found among open Issues.');
            const marker = '<!-- delegation-risk-p1:admin-policy-v4 -->';
            const labels = issue.labels.map(label => label.name).filter(name => !name.startsWith('status:'));
            labels.push('status:in-progress');
            await github.rest.issues.update({ ...context.repo, issue_number: issue.number, labels: [...new Set(labels)] });
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: issue.number, per_page: 100 });
            if (!comments.some(comment => comment.body?.includes(marker))) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `${marker}\n## Tranche implementee le 2026-10-10\nClassification deterministe par type avec facteurs explicites ; aucun type actuellement livre n'est faible. Les routes serveur de publication du site et d'envoi Gmail imposent toujours la confirmation humaine. Une page admin dediee permet maintenant de regler un niveau de risque persistant par type d'action ; ADMIN_EMAILS explicite est requis et le plancher de securite reste non abaissable. Tests de la page admin, refus non-admin, CI et build passes.\n\n**Activation base encore requise :** sauvegarder la base prototype, verifier DATABASE_URL, puis appliquer la migration additive DelegationRiskSetting comme indique dans docs/delegation-risk-admin.md. Aucun db push n'est execute par le deploiement.\n\n**Encore ouvert dans cette US :** decision des deux fondateurs par type d'action, modes de delegation persistants par entreprise, evaluation des contextes reels de depense/reversibilite et garde de tous les connecteurs avant tout mode autonome.\n\nDetails : https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/delegation-risk-admin.md`
              });
            }