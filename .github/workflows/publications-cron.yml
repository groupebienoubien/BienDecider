name: Publications planifiées

# Ordonnanceur des programmations (story 12.4, #261) : la précision annoncée à l'écran est « vers {heure} »,
# GitHub pouvant retarder un déclenchement planifié de quelques minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publications-cron
  cancel-in-progress: false

jobs:
  run:
    name: Diffuser les programmations dues
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Appeler l'ordonnanceur
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://www.biendecider.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::Secret CRON_SECRET absent"; exit 1; fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/publications"
