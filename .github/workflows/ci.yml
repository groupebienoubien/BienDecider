name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Throwaway database, recreated on every run: never the prototype database.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      # Dummy value, only meaningful for the throwaway database above.
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      UX_TEST_BASE_URL: http://localhost:3000
      # Closes the admin area to an explicit list, as required before opening to external users.
      ADMIN_EMAILS: ci-admin@example.invalid
      # Dummy Meta application, never sent to Meta: lets the Facebook start and callback routes run in tests.
      META_APP_ID: ci-meta-app
      META_APP_SECRET: ci-meta-secret
      META_TOKEN_ENCRYPTION_KEY: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      LINKEDIN_CLIENT_ID: ci-linkedin-client
      LINKEDIN_CLIENT_SECRET: ci-linkedin-secret
      LINKEDIN_TOKEN_ENCRYPTION_KEY: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (warnings block)
        run: npm run lint
      - name: Gmail tests (no network)
        run: npm run test:gmail
      - name: Database URL resolution tests (no network)
        run: npm run test:database-url
      - name: Session token tests (no database)
        run: npm run test:session
      - name: Voice helpers tests (no database)
        run: npm run test:voice
      - name: Backlog importer tests (no network)
        run: node --test scripts/sync-backlog.test.cjs
      - name: Wiki pages build and relative links resolve
        run: node scripts/build-wiki.cjs "$RUNNER_TEMP/wiki-pages" --strict
      - name: Delegation risk tests (no network)
        run: npm run test:delegation
      - name: Apply versioned migrations to the throwaway database
        run: npx prisma migrate deploy
      - name: Schema has no change missing from migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Production build and TypeScript
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Start the built app
        run: |
          npm run start > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/app.log"
          exit 1
      - name: Brand tests (browser, no data)
        run: npm run test:brand
      - name: User journey tests (browser, throwaway database)
        run: npm run test:ux
      - name: Security tests (forged cookies, lockout, cross-company isolation)
        run: npm run test:security
      - name: LinkedIn tests (mocked provider, throwaway database)
        run: npm run test:linkedin
      - name: Facebook connector tests (no call to Meta)
        run: npm run test:facebook
      - name: Engine tests (Paul and agents around model calls, throwaway database)
        run: npm run test:engine
      - name: Source reading tests (no call to Google, throwaway database)
        run: npm run test:sources
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            ${{ runner.temp }}/app.log
          retention-days: 7
